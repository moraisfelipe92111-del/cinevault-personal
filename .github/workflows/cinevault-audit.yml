name: CineVault audit checks

on:
  push:
    branches: [cv2-auditoria-00]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cinevault-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Testes e compilacao web
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependencias do lockfile
        run: npm ci --no-audit --no-fund
      - name: Executar testes
        run: npm run test:unit
      - name: Verificar TypeScript e compilar aplicativo web
        run: npm run build
      - name: Confirmar que os arquivos versionados foram preservados
        run: git diff --exit-code
