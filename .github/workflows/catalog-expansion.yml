name: CineVault 2.0 - Candidatos de Filmes
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidates:
    name: Gerar lista segura de candidatos TMDb
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar seleção de candidatos
        run: node --test tests/catalog-expansion.test.mjs
      - name: Gerar lista de candidatos sem modificar filmes atuais
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        run: node scripts/collect-movie-candidates.mjs
      - name: Exportar lista para revisão
        uses: actions/upload-artifact@v4
        with:
          name: CineVault-2-Candidatos-Para-Revisao
          path: |
            planning/cinevault2-candidates.json
            planning/cinevault2-candidate-stats.json
          if-no-files-found: error
          retention-days: 30
