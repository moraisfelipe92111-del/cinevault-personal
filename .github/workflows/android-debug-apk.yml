name: CineVault Android APK (teste)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - 'index.html'
      - '.github/workflows/android-debug-apk.yml'

permissions:
  contents: read

jobs:
  android-debug:
    name: Compilar APK de teste
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Verificar Android SDK instalado
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
      - name: Instalar dependências JavaScript
        run: npm install --no-audit --no-fund
      - name: Testar integridade do CineVault
        run: npm run test:unit
      # Cache generated trailer IDs across Android builds. No secret is cached.
      - name: Restaurar indice automatico de trailers
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            src/trailerCatalog.json
            src/movieTmdbIds.json
            src/trailerSyncStatus.json
          key: cinevault-tmdb-trailers-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            cinevault-tmdb-trailers-${{ runner.os }}-
      - name: Encontrar trailers automaticamente no TMDb
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        run: |
          if [ -n "$TMDB_READ_ACCESS_TOKEN" ]; then
            npm run trailers:sync
          else
            echo 'TMDb secret ainda nao configurado. Conservando indice de trailers existente.'
          fi
      - name: Compilar catálogo e aplicativo web
        run: npm run build
      - name: Criar projeto Android com Capacitor
        run: |
          npx cap add android
          npx cap sync android
      - name: Preparar ícone e atualizador nativo do CineVault
        run: |
          node scripts/apply-android-icons.mjs
          node scripts/configure-native-identity.mjs
          node scripts/install-android-updater.mjs
      - name: Restaurar assinatura permanente
        env:
          KEYSTORE_B64: ${{ secrets.CINEVAULT_DEBUG_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          mkdir -p "$HOME/.android"
          printf %s "$KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android >/dev/null
      - name: Definir versao Android 1.3.1
        run: |
          sed -i -E 's/versionCode[[:space:]]+[0-9]+/versionCode 14/' android/app/build.gradle
          sed -i -E 's/versionName[[:space:]]+"[^"]+"/versionName "1.3.1"/' android/app/build.gradle
          grep -Eq 'versionCode[[:space:]]+14' android/app/build.gradle
          grep -Eq 'versionName[[:space:]]+"1.3.1"' android/app/build.gradle
      - name: Fixar assinatura no Gradle
        run: |
          cat >> android/app/build.gradle <<'GRADLE'
          android {
              signingConfigs {
                  debug {
                      storeFile file(System.getenv('HOME') + '/.android/debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
          }
          GRADLE
      - name: Gerar APK debug
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleDebug --no-daemon
      - name: Verificar pacote e versionCode da release
        run: |
          set -euo pipefail
          AAPT=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)
          test -x "$AAPT"
          INFO=$("$AAPT" dump badging android/app/build/outputs/apk/debug/app-debug.apk | head -n 1)
          echo "$INFO"
          echo "$INFO" | grep -F "name='com.cinevault.pessoal'"
          echo "$INFO" | grep -F "versionCode='14'"
          echo "$INFO" | grep -F "versionName='1.3.1'"
      - name: Assinar e validar APK com chave permanente
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          SIGNED="$RUNNER_TEMP/cinevault-assinado.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -print | sort -V | tail -n 1)

          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "ERRO: apksigner indisponivel"
            exit 1
          fi

          "$APKSIGNER" sign --ks "$HOME/.android/debug.keystore" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out "$SIGNED" "$APK"

          "$APKSIGNER" verify --verbose --print-certs "$SIGNED" > "$RUNNER_TEMP/cinevault-cert.txt"

          EXPECTED=$(keytool -exportcert -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android | openssl dgst -sha256 | awk '{print $NF}')
          echo "=== Certificados identificados pelo apksigner ==="
          grep -iE "signer.*certificate|verified using" "$RUNNER_TEMP/cinevault-cert.txt" || true
          ACTUAL=$(awk 'tolower($0) ~ /certificate sha-256 digest:/ {print $NF; exit}' "$RUNNER_TEMP/cinevault-cert.txt" | tr -d "\r" | tr "[:upper:]" "[:lower:]")
          if ! [[ "$ACTUAL" =~ ^[0-9a-f]{64}$ ]]; then
            echo "ERRO: formato do certificado nao reconhecido"
            sed -n '1,40p' "$RUNNER_TEMP/cinevault-cert.txt"
            exit 1
          fi

          echo "Certificado esperado: $EXPECTED"
          echo "Certificado do APK: $ACTUAL"

          test -n "$EXPECTED"
          test -n "$ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "ERRO: certificado diferente"
            exit 1
          fi

          mv "$SIGNED" "$APK"
          echo "ASSINATURA PERMANENTE CONFIRMADA"
      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: CineVault-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
