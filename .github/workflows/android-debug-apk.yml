name: Sintonema Android - APK de teste

on:
  workflow_dispatch:
  push:
    branches: [main, cv2-auditoria-00]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'tests/**'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - 'index.html'
      - '.github/workflows/android-debug-apk.yml'

permissions:
  contents: read

concurrency:
  group: sintonema-device-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    name: Compilar APK para teste no aparelho
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[device-test]')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar dependencias do lockfile
        run: npm ci --no-audit --no-fund
      - name: Testar aplicativo e verificadores nativos
        run: |
          npm run test:unit
          python3 -B -m unittest discover -s tests -p 'test_native_*.py' -v
      - name: Compilar aplicativo real
        run: npm run build
      - name: Preparar SDK Android
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Gerar aplicativo Android e aplicar identidade existente
        run: |
          npx cap add android
          npx cap sync android
          node scripts/apply-android-icons.mjs
          node scripts/configure-native-identity.mjs
          node scripts/install-android-updater.mjs
          node --experimental-strip-types scripts/prepare-android-device-test.mjs
      - name: Compilar APK de teste
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --max-workers=2 --console=plain --stacktrace
      - name: Assinar com a chave permanente e verificar certificado
        env:
          KEYSTORE_B64: ${{ secrets.CINEVAULT_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$KEYSTORE_B64"
          printf %s "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/cinevault-device-test.keystore"
          keytool -exportcert -keystore "$RUNNER_TEMP/cinevault-device-test.keystore" \
            -alias androiddebugkey -storepass android \
            | openssl dgst -sha256 -r | awk '{print $1}' > "$RUNNER_TEMP/cinevault-device-signer.sha256"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/cinevault-device-test.keystore" --ks-key-alias androiddebugkey \
            --ks-pass pass:android --key-pass pass:android \
            --out "$RUNNER_TEMP/cinevault-device-signed.apk" \
            android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs \
            "$RUNNER_TEMP/cinevault-device-signed.apk" > "$RUNNER_TEMP/cinevault-device-certificates.txt"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging \
            "$RUNNER_TEMP/cinevault-device-signed.apk" > "$RUNNER_TEMP/cinevault-device-badging.txt"
      - name: Conferir APK final, SQLite e ausencia de sonda
        run: |
          python3 scripts/verify-android-device-apk.py \
            --apk "$RUNNER_TEMP/cinevault-device-signed.apk" \
            --badging "$RUNNER_TEMP/cinevault-device-badging.txt" \
            --certificates "$RUNNER_TEMP/cinevault-device-certificates.txt" \
            --expected-signer "$RUNNER_TEMP/cinevault-device-signer.sha256" \
            --metadata "$RUNNER_TEMP/cinevault-device-build.json" \
            --output "$RUNNER_TEMP/sintonema-device-delivery"
      - name: Conferir preservacao dos fontes
        run: git diff --exit-code
      - name: Disponibilizar APK e roteiro de teste
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Sintonema-Android-teste-${{ env.CV_DEVICE_VERSION }}-build${{ env.CV_DEVICE_BUILD }}
          path: ${{ runner.temp }}/sintonema-device-delivery/
          if-no-files-found: error
          retention-days: 7
      - name: Remover somente a copia temporaria da chave
        if: always()
        run: rm -f -- "$RUNNER_TEMP/cinevault-device-test.keystore"
