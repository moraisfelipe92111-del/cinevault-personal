name: CineVault Android APK (teste)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - 'index.html'
      - '.github/workflows/android-debug-apk.yml'

permissions:
  contents: read

jobs:
  android-debug:
    name: Compilar APK de teste
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Verificar Android SDK instalado
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
      - name: Instalar dependências JavaScript
        run: npm install --no-audit --no-fund
      - name: Compilar catálogo e aplicativo web
        run: npm run build
      - name: Criar projeto Android com Capacitor
        run: |
          npx cap add android
          npx cap sync android
      - name: Restaurar assinatura permanente
        env:
          KEYSTORE_B64: ${{ secrets.CINEVAULT_DEBUG_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          mkdir -p "$HOME/.android"
          printf %s "$KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android >/dev/null
      - name: Definir versao Android 0.7
        run: |
          sed -i -E 's/versionCode[[:space:]]+[0-9]+/versionCode 7/' android/app/build.gradle
          sed -i -E 's/versionName[[:space:]]+"[^"]+"/versionName "0.7.0"/' android/app/build.gradle
          grep -Eq 'versionCode[[:space:]]+7' android/app/build.gradle
          grep -Eq 'versionName[[:space:]]+"0.7.0"' android/app/build.gradle
      - name: Fixar assinatura no Gradle
        run: |
          cat >> android/app/build.gradle <<'GRADLE'
          android {
              signingConfigs {
                  debug {
                      storeFile file(System.getenv('HOME') + '/.android/debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
          }
          GRADLE
      - name: Gerar APK debug
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleDebug --no-daemon
      - name: Conferir assinatura final
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          EXPECTED=$(keytool -exportcert -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android | openssl dgst -sha256 | awk '{print $NF}')
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)
          test -n "$APKSIGNER"
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test -n "$EXPECTED"
          test -n "$ACTUAL"
          echo "Certificado esperado: $EXPECTED"
          echo "Certificado do APK: $ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "ERRO: assinatura diferente da chave permanente."
            exit 1
          fi
          echo "OK: APK assinado com a chave permanente."
      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: CineVault-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
